server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # arquivos aqui são multi-GB: sem limite de corpo. nginx já suporta Range
    # requests nativamente pra estático, então resume de download funciona
    client_max_body_size 0;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}
