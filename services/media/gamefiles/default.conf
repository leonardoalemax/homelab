server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # ISOs são multi-GB: sem limite de corpo e sem buffer em disco, nginx já
    # suporta Range requests nativamente para servir estático (resume funciona)
    client_max_body_size 0;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}
