name: base

services:
    frigate:
        image: ghcr.io/blakeblackshear/frigate:stable
        container_name: ${PREFIX}-frigate
        restart: unless-stopped
        shm_size: "128mb"
        environment:
            - TZ=America/Sao_Paulo
        volumes:
            - ${STORAGE}/frigate/config:/config
            - ${STORAGE}/frigate/media:/media/frigate
            - type: tmpfs
              target: /tmp/cache
              tmpfs:
                  size: 536870912
        devices:
            - /dev/video0:/dev/video0
        ports:
            - 5000:5000
            - 8971:8971
            - 8554:8554
            - 8555:8555/tcp
            - 8555:8555/udp
