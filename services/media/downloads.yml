name: base

services:
    downloads:
        container_name: ${PREFIX}-downloads
        image: nginx:alpine
        volumes:
            # raiz genérica: cada "área" (games, e futuramente outras) vive aqui
            # como uma subpasta. NÃO pode ser :ro -- com :ro o Docker não
            # consegue criar o diretório "games" (mountpoint do bind abaixo)
            # dentro dela se ${STORAGE}/downloads ainda não existir no disco
            - ${STORAGE}/downloads:/usr/share/nginx/html
            # área "games": reaproveita a pasta real já usada pelo ps3netsrv.yml,
            # sem duplicar nem mover nada
            - ${STORAGE}/Games:/usr/share/nginx/html/games:ro
            # área "anime": mount físico separado (${ARCHIVE_STORAGE}), diferente
            # do ${STORAGE} usado por tudo mais
            - ${ARCHIVE_STORAGE}/Anime:/usr/share/nginx/html/anime:ro
            - ./downloads/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - 8078:80
        restart: unless-stopped
